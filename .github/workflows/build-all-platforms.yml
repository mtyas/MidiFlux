name: Build MidiFlux (Windows, macOS, Linux)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: MidiFlux-Windows
            build_dir: build
            cmake_flags: ""
          - os: macos-14
            artifact_name: MidiFlux-macOS-Universal
            build_dir: build
            cmake_flags: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
          - os: ubuntu-22.04
            artifact_name: MidiFlux-Linux-x64
            build_dir: build
            cmake_flags: ""

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libjack-jackd2-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libcurl4-openssl-dev \
            libgtk-3-dev

      - name: Configure CMake
        run: |
          cmake -B ${{ matrix.build_dir }} \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_flags }}

      - name: Build Plugins & Standalone
        run: |
          cmake --build ${{ matrix.build_dir }} --config Release --target MidiFlux_All MidiFlux_CLAP MidiFluxTests --parallel

      - name: Run Verification Tests
        run: |
          if [ -f "${{ matrix.build_dir }}/Release/MidiFluxTests.exe" ]; then
            "${{ matrix.build_dir }}/Release/MidiFluxTests.exe"
          elif [ -f "${{ matrix.build_dir }}/MidiFluxTests" ]; then
            "${{ matrix.build_dir }}/MidiFluxTests"
          elif [ -f "${{ matrix.build_dir }}/MidiFluxTests_artefacts/Release/MidiFluxTests" ]; then
            "${{ matrix.build_dir }}/MidiFluxTests_artefacts/Release/MidiFluxTests"
          else
            echo "Searching for MidiFluxTests executable..."
            TEST_BIN=$(find ${{ matrix.build_dir }} -type f \( -name "MidiFluxTests" -o -name "MidiFluxTests.exe" \) | head -n 1)
            if [ -n "$TEST_BIN" ]; then
              "$TEST_BIN"
            else
              echo "Error: MidiFluxTests executable not found."
              exit 1
            fi
          fi

      - name: Stage Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p artifacts-windows
          find "${{ matrix.build_dir }}/MidiFlux_artefacts" -type d -name "MidiFlux.vst3" -exec cp -R {} artifacts-windows/ \; 2>/dev/null || true
          find "${{ matrix.build_dir }}/MidiFlux_artefacts" -type f -name "MidiFlux.clap" -exec cp {} artifacts-windows/ \; 2>/dev/null || true
          find "${{ matrix.build_dir }}/MidiFlux_artefacts" -type f -name "MidiFlux.exe" -exec cp {} artifacts-windows/ \; 2>/dev/null || true

      - name: Stage Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts-macos
          find "${{ matrix.build_dir }}/MidiFlux_artefacts" -type d -name "MidiFlux.vst3" -exec cp -R {} artifacts-macos/ \; 2>/dev/null || true
          find "${{ matrix.build_dir }}/MidiFlux_artefacts" -type f -name "MidiFlux.clap" -exec cp {} artifacts-macos/ \; 2>/dev/null || true
          find "${{ matrix.build_dir }}/MidiFlux_artefacts" -type d -name "MidiFlux.clap" -exec cp -R {} artifacts-macos/ \; 2>/dev/null || true
          find "${{ matrix.build_dir }}/MidiFlux_artefacts" -type d -name "MidiFlux.component" -exec cp -R {} artifacts-macos/ \; 2>/dev/null || true
          find "${{ matrix.build_dir }}/MidiFlux_artefacts" -type d -name "MidiFlux.app" -exec cp -R {} artifacts-macos/ \; 2>/dev/null || true

      - name: Stage Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts-linux
          find "${{ matrix.build_dir }}/MidiFlux_artefacts" -type d -name "MidiFlux.vst3" -exec cp -R {} artifacts-linux/ \; 2>/dev/null || true
          find "${{ matrix.build_dir }}/MidiFlux_artefacts" -type f -name "MidiFlux.clap" -exec cp {} artifacts-linux/ \; 2>/dev/null || true
          find "${{ matrix.build_dir }}/MidiFlux_artefacts" -type d -name "MidiFlux.clap" -exec cp -R {} artifacts-linux/ \; 2>/dev/null || true
          find "${{ matrix.build_dir }}/MidiFlux_artefacts" -type f -name "MidiFlux" -exec cp {} artifacts-linux/ \; 2>/dev/null || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            artifacts-windows
            artifacts-macos
            artifacts-linux
